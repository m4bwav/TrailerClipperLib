# Weekly update pull requests. Merge when CI is green; read the release notes before merging a major.
# The actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      test-packages:
        patterns:
          - "NUnit*"
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Testing.*"
          - "coverlet.*"
  # Updates the SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
